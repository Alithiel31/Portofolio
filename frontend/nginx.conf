server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;

    # Assets statiques — cache long terme (Vite génère des noms hachés)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Ce bloc déclare son propre add_header : sans ce include, les en-têtes de
        # sécurité du niveau server ne seraient pas émis ici.
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Captures d'écran des projets — servies par Express (app.use('/screenshots', …)).
    # Sans ce bloc, ces URLs tombaient dans le fallback SPA et renvoyaient index.html.
    location /screenshots/ {
        proxy_pass http://backend:3001/screenshots/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API → backend
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Express lit X-Forwarded-For (app.set('trust proxy', …)). Sans cet en-tête, req.ip
        # valait l'IP interne de ce conteneur pour tous les visiteurs : géolocalisation
        # inopérante et rate limiter partagé par l'ensemble du trafic.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # IP réelle du visiteur telle que vue par Cloudflare. Utilisée uniquement en mémoire
        # côté backend (résolution du pays, clé hashée du rate limiter) — jamais persistée.
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    # SPA fallback — toutes les routes renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
