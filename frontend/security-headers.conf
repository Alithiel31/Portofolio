# En-têtes de sécurité appliqués aux réponses servies par nginx.
#
# ⚠️ nginx n'hérite les `add_header` du niveau parent que si le bloc courant n'en déclare
# aucun. Comme plusieurs `location` posent leurs propres en-têtes (Cache-Control…), ce
# fichier doit être `include` explicitement dans chacun d'eux, sinon les en-têtes de
# sécurité disparaissent silencieusement de ces réponses.
#
# C'est nginx qui sert le document HTML en production : la CSP configurée via helmet dans
# le backend ne couvre que les réponses JSON de /api/ et n'atteint jamais la page.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://cdn.jsdelivr.net https://github.com https://avatars.githubusercontent.com https://picsum.photos https://fastly.picsum.photos; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

# TLS terminé par Cloudflare en amont ; `preload` volontairement omis (engagement difficile
# à annuler, à activer sciemment).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# Notes sur la CSP :
#  - 'unsafe-inline' en style-src : Svelte pose des attributs `style=` (ex. `--card-count`
#    dans App.svelte) et la police Nunito est importée depuis la feuille de style.
#  - github.com / avatars.githubusercontent.com : `photoUrl` du profil.
#  - cdn.jsdelivr.net : icônes devicon des compétences.
#  - picsum.photos : images de projet du seed de développement. À retirer une fois le seed
#    pointé sur les captures réelles de backend/public/screenshots/.
