services:
  postgres:
    image: postgres:16-alpine
    labels:
      - "homelab.tier=app"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: production
    labels:
      - "homelab.tier=app"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # node:22-alpine embarque fetch ; pas besoin d'ajouter curl à l'image.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      # Laisse le temps à `prisma migrate deploy` de s'exécuter avant le premier test.
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      target: production
    # Pas de port publié : le frontend est servi via Traefik (réseau traefik-net).
    networks:
      - default
      - traefik-net
    labels:
      - "homelab.tier=app"
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio.rule=Host(`alithiel31.dev`)"
      - "traefik.http.routers.portfolio.entrypoints=web"
      - "traefik.http.services.portfolio.loadbalancer.server.port=8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  traefik-net:
    external: true

volumes:
  postgres_data: