name: Deploy (RPi)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to RPi
    # Ne déploie que si la CI (lint + tests + build + docker-build) a réussi sur main,
    # ou si le déclenchement est manuel (workflow_dispatch).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, rpi]
    steps:
      - name: Pull latest code
        run: |
          cd ~/Portofolio
          git fetch origin main
          git reset --hard origin/main

      - name: Rebuild and restart containers
        run: |
          cd ~/Portofolio
          docker compose up --build -d

      - name: Prune old images
        run: docker image prune -f
