name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend (lint + test + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # `prisma validate`/`generate` n'ont besoin que de la variable présente, pas d'une
      # base réellement joignable : aucune connexion n'est ouverte par ces commandes.
      DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prisma validate
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Test
        run: npm test

      - name: Build (tsc)
        run: npm run build

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image (production stage)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: false

      - name: Build frontend image (production stage)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          push: false
