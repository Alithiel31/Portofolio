name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege par défaut : aucun job ci-dessous n'a besoin d'écrire sur le dépôt
# ou d'appeler l'API GitHub au-delà du checkout.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check (svelte-check)
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend (lint + test + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Base jetable : sert uniquement à vérifier que les migrations s'appliquent proprement
      # (détecte une dérive entre schema.prisma et l'historique des migrations, ou du SQL
      # cassé), sans toucher à une base réelle. Recréée à zéro à chaque run.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prisma validate
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to a throwaway database
        run: npx prisma migrate deploy

      - name: Test
        run: npm test

      - name: Build (tsc)
        run: npm run build

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image (production stage)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: production
          push: false

      - name: Build frontend image (production stage)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: production
          push: false

  e2e:
    name: E2E (Playwright sur la stack Docker de production)
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Même stack qu'en production (images `production`, nginx devant le backend), avec le
      # PostgreSQL jetable du profil `dev` et son relais sur 127.0.0.1:8080.
      - name: Start the production stack
        run: |
          docker network create traefik-net
          cp backend/.env.example backend/.env
          docker compose --profile dev up -d --build --wait

      # tsx est une dépendance de dev, absente de l'image de production : npx la récupère.
      - name: Seed the database
        run: docker compose exec -T backend npx -y tsx prisma/seed.ts

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test

      - name: Stack logs on failure
        if: failure()
        run: docker compose --profile dev logs --no-color

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7
